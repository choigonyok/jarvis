# mind-svc 를 로컬에서 스택째로 돌려 보는 compose. 운영 스택과 따로 노는
# 프로젝트(jarvis-mind)라 볼륨·네트워크가 섞이지 않는다.
#
#   scripts/mind stack      # 띄우기 (LLM 키는 맥미니 .env 에서 실행할 때만 읽어 온다)
#   open http://localhost:8102
#   scripts/mind down       # 내리기 (-v 로 데이터까지)
#
# Postgres 와 input-svc 는 이 네트워크 안에만 있다. 바깥에 열리는 것은
# 루프백의 mind 콘솔 하나라서, 버리는 로컬 DB 의 비밀번호를 여기 적어 둔다.
name: jarvis-mind

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_PASSWORD: mind-local
      POSTGRES_USER: jarvis
      POSTGRES_DB: jarvis
      TZ: Asia/Seoul
    volumes:
      - mind-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 3s
      timeout: 3s
      retries: 30

  db-migrate:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    entrypoint: ["/bin/sh", "/db/migrate.sh"]
    environment:
      PGHOST: postgres
      PGUSER: jarvis
      PGDATABASE: jarvis
      PGPASSWORD: mind-local
    volumes:
      - ./db:/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  input:
    build:
      context: ./input-svc
      additional_contexts:
        gocommon: ./gocommon
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgres://jarvis:mind-local@postgres:5432/jarvis?sslmode=disable
      API_TOKEN: mind-local-token
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  mind:
    build:
      context: ./mind-svc
      additional_contexts:
        gocommon: ./gocommon
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgres://jarvis:mind-local@postgres:5432/jarvis?sslmode=disable
      INPUT_URL: http://input:8101
      API_TOKEN: mind-local-token
      MIND_UI_URL: http://localhost:8102/
      MIND_CONTENT_KEY: ${MIND_CONTENT_KEY:-}
      # 버리는 로컬 스택이라 키 없이도 연다. 운영 스택(docker-compose.yml)은 키가 없으면 뜨지 않는다.
      MIND_ALLOW_PLAINTEXT: "true"
      MIND_ANTHROPIC_API_KEY: ${MIND_ANTHROPIC_API_KEY:-}
      MIND_OWNER_NAME: ${MIND_OWNER_NAME:-나}
      # 시뮬레이터로 시험하기 좋게 짧게. 운영 기본값은 1분.
      MIND_SETTLE: ${MIND_SETTLE:-3s}
    ports:
      - "127.0.0.1:${MIND_PORT:-8102}:8102"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      input:
        condition: service_started

volumes:
  mind-postgres:
