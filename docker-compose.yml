services:
  # 진실의 원천. 서비스들의 테이블과 이벤트 로그가 여기 있다. 사람·사실의
  # 회수는 memory-svc(FalkorDB 그래프)가 맡는다 - 여기에 있던 회수용 벡터
  # 테이블은 049 에서 지웠다. 이미지가 pgvector 인 것은 새로 설치할 때 초기
  # 마이그레이션(001·009·013)이 vector 확장을 만들기 때문뿐이다.
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      # 비밀번호에 기본값을 두지 않는다. 루프백에만 열려 있다고는 해도,
      # 리포지터리에 적힌 비밀번호는 비밀번호가 아니다.
      #   openssl rand -hex 24
      POSTGRES_PASSWORD: ${JARVIS_POSTGRES_PASSWORD:?JARVIS_POSTGRES_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_USER: ${JARVIS_POSTGRES_USER:-jarvis}
      POSTGRES_DB: ${JARVIS_POSTGRES_DB:-jarvis}
      # initdb 때의 TZ 가 서버의 timezone 기본값이 된다. UTC 로 초기화되면
      # 날짜만 찍는 조회가 한국 시간 자정~09시에 하루 밀린다.
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - jarvis-postgres:/var/lib/postgresql/data
    # 루프백에만. psql 로 직접 들여다보는 것이 개발 중 가장 빠른 디버깅 경로라
    # 포트는 열어둔다.
    ports:
      - "127.0.0.1:${JARVIS_POSTGRES_PORT:-5432}:5432"
    expose:
      - "5432"
    healthcheck:
      # -U 를 주지 않으면 컨테이너의 root 로 물어보고, 그 역할은 없으므로
      # 영원히 unhealthy 로 남는다.
      test:
        ["CMD-SHELL", "pg_isready -U ${JARVIS_POSTGRES_USER:-jarvis} -d ${JARVIS_POSTGRES_DB:-jarvis}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - data
    restart: unless-stopped

  # 스키마. 한 번 돌고 끝나는 서비스이고, 나머지는 이것이 성공으로 끝난 뒤에
  # 뜬다. postgres 이미지를 그대로 쓰는 이유는 psql 이 이미 안에 있어서다.
  db-migrate:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    entrypoint: ["/bin/sh", "/db/migrate.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${JARVIS_POSTGRES_USER:-jarvis}
      PGDATABASE: ${JARVIS_POSTGRES_DB:-jarvis}
      PGPASSWORD: ${JARVIS_POSTGRES_PASSWORD:?JARVIS_POSTGRES_PASSWORD 를 .env 에 설정하세요}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./db:/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    # 성공하면 끝이다. 재시작하면 "변경 없음"을 무한히 찍는다.
    networks:
      - data
    restart: "no"

  agent:
    build:
      context: ./agent
      additional_contexts:
        gocommon: ./gocommon
    environment:
      # Subscription billing. Generate with: claude setup-token
      # Empty is allowed here so the image can be built without one; the agent
      # itself refuses to start without it, with the same instruction.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # The agent computes "오늘" for the model; in UTC that is a day off for
      # anyone east of Greenwich once it passes midnight locally.
      TZ: ${TZ:-Asia/Seoul}
      JARVIS_MODEL: ${JARVIS_MODEL:-}
      # 백그라운드 모델. 비우면 에이전트 기본값: 주문 조회·작업 sonnet, 잘 안 끝난 작업의 재시도 opus.
      JARVIS_ENRICH_MODEL: ${JARVIS_ENRICH_MODEL:-}
      JARVIS_JOBS_MODEL: ${JARVIS_JOBS_MODEL:-}
      JARVIS_JOBS_RETRY_MODEL: ${JARVIS_JOBS_RETRY_MODEL:-}
      # Tools that skip the approval card. Read-only only - calendar writes
      # are deliberately absent, so every one of them lands on a card.
      # 카드 없이 쓰는 도구: 읽기만. 비우면 에이전트 기본값(config.go)을 쓰고, 어느 쪽이든 켜진 모듈의
      # 조회 도구(자산·가계부·기억·위치·메시지·로그인 목록)는 에이전트가 더한다 - 새 조회 도구 때문에 여기나 .env 를
      # 고칠 일이 없다. 파일은 워크스페이스·첨부 사진 안에서만 읽고(에이전트가 경로 규칙을 붙인다),
      # 맨 Read·Glob·Grep, 셸·편집, 작업 만들기·지시는 여기 적어도 에이전트가 뺀다.
      JARVIS_ALLOWED_TOOLS: ${JARVIS_ALLOWED_TOOLS:-}
      # 대화에 실리는 CLI 내장 도구. 비우면 Read,Glob,Grep,TodoWrite,WebSearch,WebFetch,ToolSearch
      # (도구 설명은 요청마다 실린다). "default" 면 CLI 의 전부.
      JARVIS_BUILTIN_TOOLS: ${JARVIS_BUILTIN_TOOLS:-}
      # 대화의 프롬프트 캐시 수명: 5m(기본) 또는 1h. 1시간짜리는 쓰기가 입력의 2배(5분은 1.25배)라,
      # 다음 질문이 대개 5분~1시간 뒤에 올 때만 이득이다. 백그라운드는 늘 5m.
      JARVIS_CACHE_TTL: ${JARVIS_CACHE_TTL:-5m}
      # 새 세션으로 넘어가는 기준(비우면 에이전트 기본값): 마지막 턴 뒤 쉰 시간(5m 캐시면 30m,
      # 1h 캐시면 1h), 기록 크기 상한 50000, 그보다 작으면 넘어가지 않는 하한 20000.
      JARVIS_SESSION_IDLE: ${JARVIS_SESSION_IDLE:-}
      JARVIS_SESSION_MAX_TOKENS: ${JARVIS_SESSION_MAX_TOKENS:-}
      JARVIS_SESSION_MIN_TOKENS: ${JARVIS_SESSION_MIN_TOKENS:-}
      # 대화가 끝나고 이만큼 조용해야 백그라운드 작업을 시작한다(비우면 5m).
      JARVIS_BACKGROUND_QUIET: ${JARVIS_BACKGROUND_QUIET:-}
      # MCP servers with no module behind them, as name=url. The browser runs
      # on the host - the container has no display and no Chrome - so this
      # dials back out through host.docker.internal.
      JARVIS_EXTRA_MCP: ${JARVIS_EXTRA_MCP:-}
      # Bearer token for the servers above. They listen where the network can
      # reach them; this is what keeps that port from being an open door.
      JARVIS_MCP_TOKEN: ${JARVIS_MCP_TOKEN:-}
      # Guards the routes the console drives. Required once the agent is
      # published (JARVIS_ALLOWED_ORIGIN set, or a tunnel in front of it).
      JARVIS_API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      JARVIS_NOTIFY_URL: http://events:8101
      JARVIS_EVENTS_URL: http://events:8101
      JARVIS_ALLOWED_ORIGIN: ${JARVIS_ALLOWED_ORIGIN:-}
      JARVIS_APPROVAL_TIMEOUT: ${JARVIS_APPROVAL_TIMEOUT:-30m}
      JARVIS_TURN_TIMEOUT: ${JARVIS_TURN_TIMEOUT:-2h}
      JARVIS_DEBUG: ${JARVIS_DEBUG:-false}
      # 캘린더는 이제 calendar-svc 가 갖고 있다. 에이전트는 카드와 도구
      # 스키마만 들고 있고, 일정은 여기로 묻는다.
      JARVIS_CALENDAR_URL: http://calendar:8093
      # 대화 기록도 마찬가지다. SSE 와 진행 상태는 에이전트에 남아 있다.
      JARVIS_CHAT_URL: http://chat:8094
      # 자산은 읽기만 한다. 주문 가능한 키는 assets-svc 에만 있고, 에이전트는
      # 거기 GET 만 친다. 부팅 의존성은 걸지 않는다 - 증권사가 죽었다고
      # 대화까지 막을 이유가 없고, 조회 실패는 도구 오류로 모델에게 간다.
      JARVIS_ASSETS_URL: http://assets:8092
      # 가계부도 읽기만 한다.
      JARVIS_SPENDING_URL: http://spending:8095
      # 작업. 대화에서 맡긴 일을 기록하는 곳이고, 실행은 에이전트의 스케줄러가 한다.
      JARVIS_JOBS_URL: http://jobs:8098
      # 로그인 정보 보관함(저장·목록·지우기만 - 꺼내는 것은 브라우저뿐).
      JARVIS_VAULT_URL: http://vault:8105
      # 하나의 관문(mind-svc). 제안은 거기서 정해지고, 그 카드가 여기서 결재 카드가 된다.
      JARVIS_MIND_URL: http://mind:8102
      # 위치·현재 상태(읽기만). get_context 도구와 판단 턴의 사실.
      JARVIS_CONTEXT_URL: http://context:8103
      JARVIS_MEMORY_URL: http://memory:8100
      # 대화에 첨부한 사진. 브라우저 컨테이너도 같은 볼륨을 읽기 전용으로 붙여
      # 작업이 웹 양식에 사진을 넣는다.
      JARVIS_UPLOADS_DIR: /uploads
      # 아직 아무도 읽지 않는다. 제안·스레드 저장소가 파일에서 이 데이터베이스로
      # 옮겨갈 때 쓰는 자리를 미리 잡아둔 것이다.
      JARVIS_DATABASE_URL: >-
        postgres://svc_agent:${JARVIS_DB_PASSWORD_AGENT:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
    volumes:
      # Everything the agent may read and act on, once approved.
      - ${JARVIS_WORKSPACE_HOST:-./workspace}:/workspace
      # The CLI's own state, kept out of the workspace.
      - jarvis-home:/home/jarvis
      # Module data. Outside the workspace so the module's tools are the only
      # way in - the CLI cannot Read or Write around them.
      - jarvis-data:/data
      - jarvis-uploads:/uploads
    # Bound to loopback, not exposed to the network. The browser container
    # reaches the agent over the compose network, but the KakaoTalk collectors
    # run on the host - accessibility is a macOS API - and this is how they
    # push what they read. Same trust model as the browser bridge: loopback
    # plus the shared token, and the web proxy still carries no credentials.
    ports:
      - "127.0.0.1:${JARVIS_AGENT_PORT:-8080}:8080"
    expose:
      - "8080"
    # 짧은 목록 형식과 조건 형식을 섞을 수 없어서 둘 다 조건으로 적는다.
    depends_on:
      browser:
        condition: service_started
      # 스키마가 없는 데이터베이스에 연결해서 테이블이 없다고 실패하는 것보다,
      # 마이그레이션이 끝날 때까지 기다리는 편이 낫다.
      db-migrate:
        condition: service_completed_successfully
      # 캘린더 모듈의 Start() 와 대화 스토어의 Connect() 가 각 서비스의 /health
      # 를 친다. 없으면 에이전트가 부팅을 포기하므로, 순서를 운에 맡기지 않는다.
      calendar:
        condition: service_healthy
      chat:
        condition: service_healthy
    networks:
      - default
      - data
      - browser
    restart: unless-stopped

  # 손님 계정의 jarvis. 운영자의 agent 와 같은 이미지지만 따로 돈다:
  # 대화(thread=guest)·CLI 기억(볼륨)·승인 카드가 모두 따로이고, 모듈은 캘린더뿐이다.
  # 자산·가계부 서비스 주소도, 브라우저 토큰도 받지 않는다 - 모델이 부를 도구가
  # 없을 뿐 아니라, 이 컨테이너가 그 문을 여는 열쇠 자체를 갖고 있지 않다.
  # (JARVIS_API_TOKEN 은 캘린더·대화 서비스 때문에 필요하다. 그래서 손님 모드의
  # 모델에게는 셸·파일 도구가 없다 - 환경변수를 읽을 길을 막는다.)
  agent-guest:
    build:
      context: ./agent
      additional_contexts:
        gocommon: ./gocommon
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      TZ: ${TZ:-Asia/Seoul}
      JARVIS_MODEL: ${JARVIS_MODEL:-}
      JARVIS_CACHE_TTL: ${JARVIS_CACHE_TTL:-5m}
      JARVIS_ROLE: guest
      # 운영자의 agent(8080)와 다른 포트. 둘이 한 터널을 쓰는데, 같은 포트일 때
      # Workers VPC 의 연결이 다른 쪽에 붙는 일이 있었다(2026-10-08).
      JARVIS_ADDR: ":8081"
      JARVIS_MCP_URL: http://127.0.0.1:8081/mcp
      # 서비스들의 토큰이 아니라 손님 것: 게이트웨이가 이것으로 부르고, 이것으로는
      # 손님 대화·손님 기억·손님 알림·같이 쓰는 캘린더(손님 쪽으로)만 열린다.
      JARVIS_API_TOKEN: ${JARVIS_GUEST_API_TOKEN:?JARVIS_GUEST_API_TOKEN 을 .env 에 설정하세요}
      JARVIS_ALLOWED_ORIGIN: ${JARVIS_ALLOWED_ORIGIN:-}
      JARVIS_APPROVAL_TIMEOUT: ${JARVIS_APPROVAL_TIMEOUT:-30m}
      JARVIS_TURN_TIMEOUT: ${JARVIS_TURN_TIMEOUT:-2h}
      JARVIS_MEMORY_URL: http://memory:8100
      JARVIS_CALENDAR_URL: http://calendar:8093
      JARVIS_CHAT_URL: http://chat:8094
      # 손님의 결재 카드는 손님 기기로(audience guest). 운영자에게는 가지 않는다.
      JARVIS_NOTIFY_URL: http://events:8101
    volumes:
      - jarvis-guest-workspace:/workspace
      - jarvis-guest-home:/home/jarvis
      - jarvis-guest-data:/data
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      calendar:
        condition: service_healthy
      chat:
        condition: service_healthy
    restart: unless-stopped

  # 운동 기록. 웹의 라우트 핸들러 + 볼륨의 JSON 파일이었던 것이 서비스가 됐다.
  # 계약은 그대로다(책 전체를 주고받는다) - 저장소만 Postgres 로 바뀌었다.
  #
  # 볼륨이 없는 것에 주의: 상태가 전부 데이터베이스에 있으므로 이 컨테이너는
  # 언제든 버려도 된다.
  workout:
    build: ./workout-svc
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8091"
      DATABASE_URL: >-
        postgres://svc_workout:${JARVIS_DB_PASSWORD_WORKOUT:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      # 스택의 나머지와 같은 베어러. /health 만 예외다.
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
    expose:
      - "8091"
    # 루프백에만. psql 처럼 curl 로 직접 두드리는 것이 가장 빠른 확인이다.
    ports:
      - "127.0.0.1:${JARVIS_WORKOUT_PORT:-8091}:8091"
    healthcheck:
      # /health 는 데이터베이스를 ping 한다. 연결이 안 되면 unhealthy 여야
      # 웹이 그 위에 뜨지 않는다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - data
    restart: unless-stopped

  # 위치·현재 상태. 폰의 OwnTracks(위치·영역 진입/이탈)와 iOS 단축어·맥 수집기(CarPlay,
  # 집중 모드, 앞에 있는 앱)가 게이트웨이(/context/owntracks, /context/signals)로 보낸 것을
  # 받아 영역 체류(visits)와 현재 상태로 만든다. 폰은 스택의 토큰을 갖지 않는다: OwnTracks 는
  # 자기 Basic 인증, 단축어는 신호 토큰. 좌표 원본은 CONTEXT_RAW_DAYS(기본 30일)만 둔다.
  context:
    build:
      context: ./context-svc
      additional_contexts:
        gocommon: ./gocommon
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8103"
      DATABASE_URL: >-
        postgres://svc_context:${JARVIS_DB_PASSWORD_CONTEXT:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      SIGNAL_TOKEN: ${CONTEXT_SIGNAL_TOKEN:-}
      OWNTRACKS_USER: ${OWNTRACKS_USER:-}
      OWNTRACKS_PASSWORD: ${OWNTRACKS_PASSWORD:-}
      EVENTS_URL: http://events:8101
      CONTEXT_RAW_DAYS: ${CONTEXT_RAW_DAYS:-30}
    expose:
      - "8103"
    ports:
      - "127.0.0.1:${JARVIS_CONTEXT_PORT:-8103}:8103"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8103/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - data
    restart: unless-stopped

  # 폰 알림. 아이폰 미러링으로 맥에 들어온 알림을 맥의 수집기(phonenote-svc/cmd/collector,
  # scripts/phonenote-collector)가 게이트웨이(/phonenote/notes)로 보내면, 여기서 해석해서
  # 의미 있는 것은 반영한다 - 배달앱 알림의 메뉴를 가계부 결제에 붙이고, 입금·택배·예약은
  # mind 가 발생으로 읽는다. 수집기는 스택의 토큰이 아니라 자기 토큰(JARVIS_PHONENOTE_TOKEN)을
  # 쓴다. 해석은 기억·판단과 같은 Anthropic 키, 하루 예산은 따로(PHONENOTE_DAILY_USD).
  phonenote:
    build: ./phonenote-svc
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8104"
      DATABASE_URL: >-
        postgres://svc_phonenote:${JARVIS_DB_PASSWORD_PHONENOTE:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      COLLECTOR_TOKEN: ${JARVIS_PHONENOTE_TOKEN:-}
      ANTHROPIC_API_KEY: ${MEMORY_ANTHROPIC_API_KEY:-}
      PHONENOTE_DAILY_USD: ${PHONENOTE_DAILY_USD:-0.3}
      SPENDING_URL: http://spending:8095
    expose:
      - "8104"
    ports:
      - "127.0.0.1:${JARVIS_PHONENOTE_PORT:-8104}:8104"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8104/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - data
    restart: unless-stopped

  # 로그인 정보 보관함. 운영자가 대화의 카드(비밀번호 칸)로 넣은 아이디·비밀번호를
  # 봉인해서(AES-256-GCM) Postgres 에 두고, 브라우저가 그 사이트의 로그인 화면에 있을
  # 때만 꺼내 준다. 키는 이 .env 에만 있다 - DB 와 백업에는 봉인된 값뿐이다.
  # 토큰이 둘: 서비스 토큰(에이전트)은 저장·목록·지우기만, 브라우저 토큰은 꺼내기만.
  # 공개 포트가 없고, data(Postgres)·browser(브라우저가 꺼내 감) 네트워크에만 붙는다.
  vault:
    build:
      context: ./vault-svc
      additional_contexts:
        gocommon: ./gocommon
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8105"
      DATABASE_URL: >-
        postgres://svc_vault:${JARVIS_DB_PASSWORD_VAULT:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      VAULT_RELEASE_TOKEN: ${JARVIS_VAULT_RELEASE_TOKEN:?JARVIS_VAULT_RELEASE_TOKEN 을 .env 에 설정하세요}
      VAULT_KEY: ${JARVIS_VAULT_KEY:?JARVIS_VAULT_KEY 를 .env 에 설정하세요 (openssl rand -base64 32)}
    expose:
      - "8105"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8105/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - data
      - browser
    restart: unless-stopped

  # 가계부. 카드사가 카톡으로 보내는 결제 알림을 카톡 수집기에서 읽어 분류하고
  # 월별로 더한다. 카톡 DB 를 직접 열지 않고 수집기의 API 로 읽는다 - 암호화된
  # 파일을 만지는 프로세스는 이 맥에 하나면 된다.
  #
  # 수집기에 부팅 의존성을 걸지 않았다. 카톡이 꺼져 있어도 지난 내역은 보여야
  # 하고, 수집은 연결되는 대로 커서부터 이어진다.
  spending:
    build:
      context: ./spending-svc
      additional_contexts:
        gocommon: ./gocommon
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8095"
      DATABASE_URL: >-
        postgres://svc_spending:${JARVIS_DB_PASSWORD_SPENDING:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      NOTIFY_URL: http://events:8101
      KAKAOTALK_URL: http://kakaotalk:8090
      # 이름에 "카드"가 없는 결제 알림 채널(예: 카카오뱅크)을 쉼표로 더한다.
      # 카카오페이 같은 간편결제는 기본으로 빼 두었다 - 카드로 충전·결제되면
      # 카드 알림과 두 번 잡힌다.
      SPENDING_EXTRA_CHANNELS: ${SPENDING_EXTRA_CHANNELS:-}
    expose:
      - "8095"
    ports:
      - "127.0.0.1:${JARVIS_SPENDING_PORT:-8095}:8095"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8095/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - data
    restart: unless-stopped

  # 작업: 대화에서 맡긴 일, 실행마다의 진행 기록, 작업이 지켜보는 대상, 사이트
  # 로그인 상태. 기록만 한다 - 실행은 에이전트의 스케줄러가 브라우저로 한다.
  jobs:
    build: ./jobs-svc
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8098"
      DATABASE_URL: >-
        postgres://svc_jobs:${JARVIS_DB_PASSWORD_JOBS:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      # 작업이 끝나고 이만큼 지나면 첨부 사진을 지운다.
      JOBS_PURGE_AFTER: ${JOBS_PURGE_AFTER:-720h}
    expose:
      - "8098"
    ports:
      - "127.0.0.1:${JARVIS_JOBS_PORT:-8098}:8098"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8098/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - data
    restart: unless-stopped

  # 대화. 무엇을 말했는지만 여기 있다.
  #
  # 캘린더와 같은 경계다. 에이전트에 남은 것은 실행 중인 프로세스의 것들이다:
  # 라이브 SSE 스트림, "지금 턴이 진행 중인가" 플래그, 그리고 몰고 있는 Claude
  # Code 세션. 셋 다 재시작을 넘겨 살아남지 않는 것이 의도다 - 방금 시작한
  # 프로세스는 턴 중간에 있지 않다 - 그래서 데이터베이스에 있을 이유가 없다.
  #
  # 제안 저장소는 옮기지 않았다. 그건 승인 게이트의 다른 반쪽이고, 결정이 날
  # 때까지 반환하지 않는 핸들러와 한 몸이다.
  chat:
    build: ./chat-svc
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8094"
      DATABASE_URL: >-
        postgres://svc_chat:${JARVIS_DB_PASSWORD_CHAT:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      # 손님 agent 의 토큰: 손님 쪽(손님 대화·손님 기억·손님 알림)만 연다.
      API_GUEST_TOKEN: ${JARVIS_GUEST_API_TOKEN:-}
    expose:
      - "8094"
    ports:
      - "127.0.0.1:${JARVIS_CHAT_PORT:-8094}:8094"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8094/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - data
    restart: unless-stopped

  # 캘린더. 일정의 저장만 여기 있다.
  #
  # 앞의 두 서비스와 경계가 다르다: 승인 카드·MCP 도구 스키마·되돌림 가능 여부는
  # agent 에 남았다. 그것들은 대화와 게이트의 속성이고, 여기로 옮기면 하나의
  # 결정이 두 프로세스에 걸쳐 쪼개진다. 이 서비스는 시키는 대로 한다 - 여기
  # 도달한 쓰기는 사람이 직접 친 것이거나 사람이 승인한 것이다.
  #
  # 파일이 워크스페이스 바깥에 있어야 했던 이유(CLI 의 Read/Write 가 모듈의
  # 스키마와 카드를 우회하는 두 번째 문이 되는 것)는 이제 더 확실히 해결된다:
  # 에이전트의 파일시스템에 캘린더가 아예 없다.
  calendar:
    build:
      context: ./calendar-svc
      additional_contexts:
        gocommon: ./gocommon
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8093"
      DATABASE_URL: >-
        postgres://svc_calendar:${JARVIS_DB_PASSWORD_CALENDAR:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      # 손님 agent 의 토큰: 손님 쪽(손님 대화·손님 기억·손님 알림)만 연다.
      API_GUEST_TOKEN: ${JARVIS_GUEST_API_TOKEN:-}
      NOTIFY_URL: http://events:8101
      # 일정 저장소. uniple 이면 커플 앱의 공유 캘린더를 비공식 Supabase
      # 호출로 쓴다(calendar-svc/README.md). postgres 로 되돌리면 예전 표를 쓴다.
      CALENDAR_BACKEND: ${CALENDAR_BACKEND:-uniple}
      UNIPLE_URL: ${UNIPLE_URL:-https://api.uniple.app}
      # 앱 번들에 공개돼 있는 anon 키. 비밀이 아니지만 앱이 바꾸면 따라 바꿔야 한다.
      UNIPLE_ANON_KEY: ${UNIPLE_ANON_KEY:-}
      # 첫 로그인 토큰. 쓰자마자 회전하므로 이후의 진짜 값은 Postgres
      # (uniple_session)에 있다. 다른 값을 넣으면 그것으로 다시 시작한다.
      UNIPLE_REFRESH_TOKEN: ${UNIPLE_REFRESH_TOKEN:-}
      UNIPLE_BLOCK_ID: ${UNIPLE_BLOCK_ID:-}
    expose:
      - "8093"
    ports:
      - "127.0.0.1:${JARVIS_CALENDAR_PORT:-8093}:8093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8093/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - data
    restart: unless-stopped

  # 자산. 업비트·KIS 를 읽는 유일한 자리다.
  #
  # 이 서비스가 따로 있는 첫 번째 이유는 키다: 주문을 낼 수 있는 키가 브라우저에
  # HTML 을 내주는 프로세스의 환경변수로 있을 이유가 없다. 읽기 전용으로만
  # 쓰지만, 그건 코드의 약속이고 키의 권한은 그대로다.
  #
  # Go 가 아닌 것도 의도다. 업비트 JWT·KIS OAuth·과거 종가 페이징은 이미
  # TypeScript 로 돌고 있었고, 그 코드에는 어렵게 얻은 예외 처리가 주석까지
  # 남아 있다. 다시 쓰는 것은 잘 돌던 연동을 깨뜨릴 위험만 산다.
  assets:
    build: ./assets-svc
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PORT: "8092"
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      NOTIFY_URL: http://events:8101
      # 스냅샷용. 없어도 자산 조회는 된다 - 증권사가 현재 보유의 원천이고,
      # 데이터베이스가 답하는 것은 "그때 무엇을 들고 있었나"뿐이다.
      DATABASE_URL: >-
        postgres://svc_assets:${JARVIS_DB_PASSWORD_ASSETS:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      UPBIT_ACCESS_KEY: ${UPBIT_ACCESS_KEY:-}
      UPBIT_SECRET_KEY: ${UPBIT_SECRET_KEY:-}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO:-}
      KIS_ACCOUNT_PRODUCT: ${KIS_ACCOUNT_PRODUCT:-01}
      KIS_MOCK: ${KIS_MOCK:-false}
      # 금현물 계좌. 한투 API 키는 계좌마다 따로 발급되므로 위 주식 계좌와
      # 별개의 키다. 비어 있으면 금은 "계좌 연결 전"으로 남는다.
      KIS_GOLD_APP_KEY: ${KIS_GOLD_APP_KEY:-}
      KIS_GOLD_APP_SECRET: ${KIS_GOLD_APP_SECRET:-}
      KIS_GOLD_ACCOUNT_NO: ${KIS_GOLD_ACCOUNT_NO:-}
      KIS_GOLD_ACCOUNT_PRODUCT: ${KIS_GOLD_ACCOUNT_PRODUCT:-01}
      # 원금을 세기 시작하는 날. 그날 들고 있던 자산은 원금 기록에 "시작
      # 자산"으로 한 줄 적고, 그 뒤의 입출금만 더하고 뺀다.
      PRINCIPAL_SINCE: ${PRINCIPAL_SINCE:-2026-05-01}
      # 조회할 곳이 없는 고정 자산(JSON 배열). 개인 금액이라 코드가 아니라 .env 에 둔다.
      FIXED_ASSETS: ${FIXED_ASSETS:-}
    expose:
      - "8092"
    ports:
      - "127.0.0.1:${JARVIS_ASSETS_PORT:-8092}:8092"
    healthcheck:
      # 데이터베이스가 없어도 200 이다. 이 서비스의 필수 조건이 아니다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - data
    restart: unless-stopped

  browser:
    build: ./browser
    environment:
      TZ: ${TZ:-Asia/Seoul}
      # Same token the agent sends. The port is on the compose network only,
      # but a bridge that accepts anything is a bridge that will be pointed at
      # something else later.
      MCP_BROWSER_TOKEN: ${JARVIS_MCP_TOKEN:-}
      # 원격 화면(VNC) 비밀번호. 웹 Worker 의 JARVIS_VNC_PASSWORD 와 같은 값(앞 8자만 쓰인다).
      VNC_PASSWORD: ${JARVIS_VNC_PASSWORD:-}
      # browser_fill_login 이 지금 탭의 사이트 로그인을 보관함에서 꺼내 넣는다(이 토큰은 꺼내기만 연다).
      VAULT_URL: http://vault:8105
      VAULT_RELEASE_TOKEN: ${JARVIS_VAULT_RELEASE_TOKEN:-}
      # 쿠팡 결제 비밀번호(쿠페이). 맥미니 .env 에만 있다 - 저장소에는 절대 두지 않는다.
      # browser_enter_payment_pin 이 쿠팡 화면의 키패드에만 넣고, 모델에게는 보이지 않는다.
      COUPANG_PAY_PIN: ${JARVIS_COUPANG_PAY_PIN:-}
    volumes:
      # Where being logged in lives. Empty this and every site asks again.
      - chrome-profile:/profile
      # Photos attached in conversation, for browser_upload_files. Read-only:
      # the browser puts them into forms and never writes here.
      - jarvis-uploads:/uploads:ro
    ports:
      # noVNC, for the first login and for watching what it is doing. Bound to
      # loopback: this view drives a logged-in browser and has no password.
      - "127.0.0.1:${JARVIS_VNC_PORT:-6080}:6080"
    expose:
      - "8931"
    # Chromium needs more than the default 64MB of shared memory or it crashes
    # on pages of any size.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8931), 3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - browser
    restart: unless-stopped

  # Near-real-time KakaoTalk collector. It polls the local KakaoTalk SQLCipher
  # database once a second, stores new messages incrementally in its own SQLite
  # file, and serves them read-only for the web tab.
  #
  # The database is keyed to the machine: the passphrase is derived from the
  # Mac's IOPlatformUUID and the account id. A Linux container cannot read
  # IOPlatformUUID, so KAKAO_UUID and KAKAO_USER_ID (or KAKAO_SQLCIPHER_KEY)
  # must be supplied, and the KakaoTalk container directory is bind-mounted
  # read-only. For the lowest latency, running the binary on the host is more
  # reliable than the VM file-share; this service is the containerised option.
  kakaotalk:
    build:
      context: ./kakaotalk-client
      additional_contexts:
        gocommon: ./gocommon
    environment:
      TZ: ${TZ:-Asia/Seoul}
      POLL_INTERVAL: ${KAKAO_POLL_INTERVAL:-1s}
      LISTEN_ADDR: ":8090"
      STORE_PATH: /data/kakaotalk.db
      KAKAO_CONTAINER_DIR: /kakao/app-support
      KAKAO_PLIST_DIR: /kakao/preferences
      # 복호화 전 사본을 매번 쓰는 곳. 디스크가 아니라 메모리에 둔다.
      KAKAO_SCRATCH_DIR: /scratch
      # 평문 사본의 보존 기한(일). 0 이면 지우지 않는다.
      RETAIN_DAYS: ${KAKAO_RETAIN_DAYS:-730}
      # 처음 뜨기 전에 카톡 앱 DB 에 있던 대화를 한 번 들여온다. 읽는 쪽은 모두
      # rowid 커서 이후만 보므로 새 메시지로 읽히지 않는다.
      KAKAO_IMPORT_HISTORY: ${KAKAO_IMPORT_HISTORY:-true}
      # Identity. Pass the account id (skips the one-time recovery scan) and the
      # machine UUID, or a pre-derived passphrase in KAKAO_SQLCIPHER_KEY.
      KAKAO_UUID: ${KAKAO_UUID:-}
      KAKAO_USER_ID: ${KAKAO_USER_ID:-}
      KAKAO_SQLCIPHER_KEY: ${KAKAO_SQLCIPHER_KEY:-}
      # Same bearer scheme as the rest of the stack; guards every route but
      # /health.
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
    volumes:
      - jarvis-kakaotalk-data:/data
      # The live encrypted database and its -wal/-shm siblings, read-only.
      - ${KAKAO_CONTAINER_HOST:-${HOME}/Library/Containers/com.kakao.KakaoTalkMac/Data/Library/Application Support/com.kakao.KakaoTalkMac}:/kakao/app-support:ro
      - ${KAKAO_PLIST_HOST:-${HOME}/Library/Containers/com.kakao.KakaoTalkMac/Data/Library/Preferences}:/kakao/preferences:ro
    ports:
      - "127.0.0.1:${KAKAO_PORT:-8090}:8090"
    expose:
      - "8090"
    tmpfs:
      - /scratch:size=256m,mode=0700,uid=65532,gid=65532
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # iMessage·문자. kakaotalk 처럼 맥의 메시지 앱 데이터베이스(chat.db)를 앞으로만
  # 읽어 따로 쌓고, 같은 모양으로 내준다. 이름은 연락처(AddressBook)에서 찾는다.
  #
  # ~/Library/Messages 는 macOS 개인정보 보호 대상이라 Docker 가 직접 마운트하지
  # 못한다. 그래서 scripts/imessage-mirror.sh 가 SSH 권한으로 ~/.jarvis-mirror 에
  # 복사해 두고(LaunchAgent com.jarvis.imessage-mirror), 이 컨테이너는 그 복사본을 읽는다.
  imessage:
    build:
      context: ./imessage-client
      additional_contexts:
        gocommon: ./gocommon
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8099"
      POLL_INTERVAL: ${IMESSAGE_POLL_INTERVAL:-2s}
      CHAT_DB: /messages/chat.db
      # 평문 사본의 보존 기한(일). 0 이면 지우지 않는다.
      RETAIN_DAYS: ${IMESSAGE_RETAIN_DAYS:-730}
      CONTACTS_DB: /addressbook/AddressBook-v22.abcddb
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
    volumes:
      - jarvis-imessage-data:/data
      - ${IMESSAGE_MIRROR:-${HOME}/.jarvis-mirror}/messages:/messages:ro
      - ${IMESSAGE_MIRROR:-${HOME}/.jarvis-mirror}/addressbook:/addressbook:ro
    ports:
      - "127.0.0.1:${IMESSAGE_PORT:-8099}:8099"
    expose:
      - "8099"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8099/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # 기억. jarvis 곳곳의 데이터를 Graphiti 지식 그래프(FalkorDB)에 쌓고, 에이전트와
  # mind 가 /search 로 꺼내 쓴다. mind 가 원문으로 확인한 사실은 /facts 로 받아
  # Graphiti 가 같은 사람·장소에 묶고 모순을 정리한다. 캘린더·가계부·자산·운동·
  # 작업·사진은 LLM 없이 그대로 넣는다. LLM 은 Claude Haiku 5.5, 임베딩과 재정렬은
  # Voyage(voyage-4-large, rerank-3) - 둘 다 API 키, 사용량 과금.
  # 손님 대화는 group "guest" 로 따로 쌓여 운영자 기억과 섞이지 않는다.
  memory:
    build: ./memory-svc
    environment:
      TZ: ${TZ:-Asia/Seoul}
      DATABASE_URL: >-
        postgres://svc_memory:${JARVIS_DB_PASSWORD_MEMORY:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      # 손님 agent 의 토큰: 손님 쪽(손님 대화·손님 기억·손님 알림)만 연다.
      API_GUEST_TOKEN: ${JARVIS_GUEST_API_TOKEN:-}
      # 없으면 글 추출만 쉬고 구조화 데이터는 계속 쌓는다.
      MEMORY_OWNER_NAME: ${MEMORY_OWNER_NAME:-}
      ANTHROPIC_API_KEY: ${MEMORY_ANTHROPIC_API_KEY:-}
      MEMORY_DAILY_USD: ${MEMORY_DAILY_USD:-1.0}
      MEMORY_BACKFILL_DAYS: ${MEMORY_BACKFILL_DAYS:-30}
      MEMORY_INTERVAL: ${MEMORY_INTERVAL:-300}
      # 소비자마다 키가 따로다(권한이 좁고, 하나만 회수할 수 있다).
      IMMICH_API_KEY: ${IMMICH_MEMORY_API_KEY:-}
      # 검색용 Voyage 키(MongoDB Atlas 에서 만든 al-… 는 ai.mongodb.com 으로 간다).
      # 쓴 토큰을 세어 헤더·상태 탭에 금액으로 보인다.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # 카톡·iMessage·운영자의 jarvis 대화는 mind 가 읽고 확인한 사실만 /facts 로
      # 보낸다. 일정·지출·자산·운동·작업·사진도 mind 가 한 번 읽어 발생으로 쓰고 같은
      # 읽기를 /records 로 보낸다(소스마다 읽는 곳 하나). 여기서는 손님 대화, 6시간
      # 일지, 주간 주제만. mind 없이 돌릴 때는 calendar,spending,… 를 다시 켠다.
      MEMORY_SOURCES: ${MEMORY_SOURCES:-chat,topics}
      MEMORY_CHAT_GROUPS: ${MEMORY_CHAT_GROUPS:-guest}
      # Graphiti 가 한 번에 부르는 LLM 수. 기본 20 이면 주간 주제 묶음이 API 한도에
      # 걸려(429) 재시도로 버틴다.
      SEMAPHORE_LIMIT: "6"
      EVENTS_URL: http://events:8101
    expose:
      - "8100"
    ports:
      - "127.0.0.1:${JARVIS_MEMORY_PORT:-8100}:8100"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      falkordb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default
      - data
    restart: unless-stopped

  falkordb:
    # 6.0 changed db.idx.fulltext.createNodeIndex; graphiti-core 0.30 calls the 4.x form.
    image: falkordb/falkordb:v4.22.0
    environment:
      # RDB 스냅숏만으로는 마지막 저장 뒤 쓰기가 비정상 종료에 사라진다. AOF 를
      # 매초 fsync 로 함께 둔다.
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    volumes:
      - jarvis-falkordb:/var/lib/falkordb/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - data
    restart: unless-stopped

  # 상태. "뭐가 고장났나"를 컨테이너가 아니라 기능 단위로 답한다 - 카톡이
  # 들어오고 있나, 에이전트 브라우저가 쿠팡에 아직 로그인돼 있나, uniple 이
  # 캘린더를 아직 들여보내나.
  #
  # 읽기만 한다. 각 서비스의 상태 응답, Postgres 의 타임스탬프처럼 이미 있는
  # 신호로 판정하고, 주문목록 접근만 브라우저로 직접 열어 본다. uniple 토큰은 쓸 때마다
  # 회전하고 KIS 토큰은 1분에 하나만 나오므로, 그것을 소모하는 감시는 감시 대상을
  # 망가뜨리는 원인이 된다.
  #
  # 부팅 의존성이 없다. 감시 대상이 죽어 있는 것이 이 서비스가 보여줘야 할 상태다.
  status:
    build:
      context: ./status-svc
      additional_contexts:
        gocommon: ./gocommon
    environment:
      # FileVault 를 끈 채로 두기로 한 운영자의 결정(받아들인 위험). 맥미니 .env 에서 정한다.
      HOST_FILEVAULT_OFF_ACCEPTED: ${JARVIS_FILEVAULT_OFF_ACCEPTED:-false}
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8096"
      DATABASE_URL: >-
        postgres://svc_status:${JARVIS_DB_PASSWORD_STATUS:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      NOTIFY_URL: http://events:8101
      KAKAOTALK_URL: http://kakaotalk:8090
      SPENDING_URL: http://spending:8095
      ASSETS_URL: http://assets:8092
      CALENDAR_URL: http://calendar:8093
      CHAT_URL: http://chat:8094
      WORKOUT_URL: http://workout:8091
      AGENT_URL: http://agent:8080
      MIND_URL: http://mind:8102
      MEMORY_URL: http://memory:8100
      CONTEXT_URL: http://context:8103
      PHONENOTE_URL: http://phonenote:8104
      VAULT_URL: http://vault:8105
      BROWSER_ADDR: browser:8931
      # 쿠팡·네이버페이 주문목록이 열리는지는 에이전트 브라우저 새 탭에서 직접
      # 열어 보고 판단한다(30분마다). 쿠키가 남아 있어도 로그아웃일 수 있었다.
    expose:
      - "8096"
    ports:
      - "127.0.0.1:${JARVIS_STATUS_PORT:-8096}:8096"
    volumes:
      # 맥미니의 전제(FileVault·Time Machine·iMessage 미러·백업)를 scripts/host-check 가
      # 10분마다 적는 곳. 컨테이너는 이것들을 직접 볼 수 없다. 읽기만 한다.
      - ${HOME}/.jarvis-host:/host:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8096/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - data
      - browser
    restart: unless-stopped

  # The agent is a Go process driving a Chromium container and a CLI; none of
  # that runs on Workers, so when the console is served from Cloudflare this is
  # how the Worker reaches back to it - outbound only, no port opened on the
  # host. Opt in with: docker compose --profile cloudflare up -d

  # 알림. 여러 서비스가 정해진 모양의 이벤트(POST /events)를 보내면, 저장·중복
  # 제거·방해 금지·저녁 요약을 거쳐 웹 푸시로 폰에 보낸다. 알림함도 여기서 읽는다.
  # VAPID 키는 .env 에만 둔다(공개 저장소).
  notify:
    build: ./notify-svc
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8097"
      DATABASE_URL: >-
        postgres://svc_notify:${JARVIS_DB_PASSWORD_NOTIFY:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      VAPID_PUBLIC_KEY: ${JARVIS_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${JARVIS_VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${JARVIS_VAPID_SUBJECT:-https://jarvis.choigonyok.com}
      EVENTS_URL: http://events:8101
    expose:
      - "8097"
    ports:
      - "127.0.0.1:${JARVIS_NOTIFY_PORT:-8097}:8097"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8097/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - data
    restart: unless-stopped
  # The event log every service reports to. It only keeps events and hands
  # each subscriber (notify, agent) the types it asked for, in order; what an
  # event means is the subscriber's to decide.
  events:
    build: ./events-svc
    environment:
      TZ: ${TZ:-Asia/Seoul}
      LISTEN_ADDR: ":8101"
      DATABASE_URL: >-
        postgres://svc_events:${JARVIS_DB_PASSWORD_EVENTS:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      # 손님 agent 의 토큰: 손님 쪽(손님 대화·손님 기억·손님 알림)만 연다.
      API_GUEST_TOKEN: ${JARVIS_GUEST_API_TOKEN:-}
    expose:
      - "8101"
    ports:
      - "127.0.0.1:${JARVIS_EVENTS_PORT:-8101}:8101"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8101/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - data
    restart: unless-stopped
  # 인지 루프. 카톡·iMessage·jarvis 대화를 읽어 일정·열린 고리(세계 모델)와
  # 기억할 사실(근거 장부 → memory-svc)을 원문 인용으로 확인해 남긴다. 사람에게
  # 닿는 유일한 관문이기도 하다: 질문은 mind.card 로 에이전트에. 콘솔은 맥미니의
  # 127.0.0.1:8102 이고 토큰이 필요하다: 한 번 /?token=<JARVIS_API_TOKEN> 으로 연다.
  mind:
    build: ./mind-svc
    environment:
      TZ: ${TZ:-Asia/Seoul}
      DATABASE_URL: >-
        postgres://svc_mind:${JARVIS_DB_PASSWORD_MIND:?scripts/db-roles 를 먼저 실행하세요}@postgres:5432/${JARVIS_POSTGRES_DB:-jarvis}?sslmode=disable
      API_TOKEN: ${JARVIS_API_TOKEN:?JARVIS_API_TOKEN 을 .env 에 설정하세요}
      # 사람이 콘솔에 들어갈 때 쓰는 토큰(scripts/mini console). 서비스들의 토큰과 다르다.
      MIND_CONSOLE_TOKEN: ${JARVIS_MIND_CONSOLE_TOKEN:-}
      EVENTS_URL: http://events:8101
      MIND_SELF_URL: http://mind:8102/consume
      KAKAOTALK_URL: http://kakaotalk:8090
      IMESSAGE_URL: http://imessage:8099
      CALENDAR_URL: http://calendar:8093
      # 관문이 하나로 합쳐져(2026-10-15) mind 의 카드가 에이전트의 결재 카드로 나간다.
      # 승인하면 mind 가 calendar-svc 에 실제로 쓴다.
      MIND_CALENDAR: ${MIND_CALENDAR:-http}
      MIND_UI_URL: /
      # 구조화 소스(가계부·운동·캘린더·사진)를 규칙으로 발생(occurrence)으로 읽는다. 캘린더의
      # 일정은 세계 모델의 일정이 되고, 일정 시간·장소 안의 결제·사진은 during 으로 이어진다.
      SPENDING_URL: http://spending:8095
      WORKOUT_URL: http://workout:8091
      MIND_CALENDAR_READ_URL: http://calendar:8093
      # 준비물 카드를 승인하면 장바구니에 담기만 하는 작업을 jobs-svc 에 만든다(결제는 안 함).
      JOBS_URL: http://jobs:8098
      # 월급 카드에 비중 차이를 적으려고 자산 배분을 읽기만 한다.
      ASSETS_URL: http://assets:8092
      # 영역 체류(visits)를 발생으로 읽는다: 지금 상황의 가장 확실한 위치 단서.
      CONTEXT_URL: http://context:8103
      PHONENOTE_URL: http://phonenote:8104
      IMMICH_URL: http://immich:2283
      # 소비자마다 키가 따로다(권한이 좁고, 하나만 회수할 수 있다).
      IMMICH_API_KEY: ${IMMICH_MIND_API_KEY:-}
      IMMICH_PUBLIC_URL: ${IMMICH_PUBLIC_URL:-}
      MIND_ANTHROPIC_API_KEY: ${MEMORY_ANTHROPIC_API_KEY:-}
      # 메시지 본문을 봉인하는 키. 없으면 뜨지 않는다(평문으로 쌓이지 않게).
      MIND_CONTENT_KEY: ${MIND_CONTENT_KEY:?MIND_CONTENT_KEY 를 .env 에 설정하세요 (openssl rand -base64 32)}
      # 메시지 본문의 보존 기한(일). 그때쯤이면 남길 것은 사실·계획이 되어 있다.
      MIND_MESSAGE_RETAIN_DAYS: ${MIND_MESSAGE_RETAIN_DAYS:-365}
      MIND_OWNER_NAME: ${MEMORY_OWNER_NAME:-}
      # 장기 기억: 확인한 사실을 memory-svc(/facts)로 보내고 해석할 때 꺼내 읽는다.
      MIND_MEMORY_URL: http://memory:8100
      # 운영자와 jarvis 의 대화도 대화방 하나로 읽는다.
      CHAT_URL: http://chat:8094
      MIND_CHAT_POLL: 60s
      # 처음 뜰 때 지난 대화를 얼마나 읽나. memory-svc 가 5분마다 이미 읽어 왔으니
      # 겹치는 만큼 같은 일정이 카드로 다시 올라오지 않게 짧게.
      MIND_BACKFILL: ${MIND_BACKFILL:-1h}
      # 감지기가 첫 시작에 건너뛴 지난 대화를 한 번, 사실만 읽는다(일정·카드 없음).
      # 끝나면 다시 돌지 않는다(mind_cursors history:done).
      MIND_HISTORY: ${MIND_HISTORY:-false}
      # 스킬·관문의 알림(아침 브리핑, 일정 전 확인)은 notify-svc 로, 질문은
      # mind.card 로 에이전트에. 카드는 이 한 길로만 나간다.
      MIND_QUIET: ${MIND_QUIET:-false}
    ports:
      - "127.0.0.1:${JARVIS_MIND_PORT:-8102}:8102"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      events:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8102/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default
      - data
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    # 공개 ingress 는 두지 않는다. Workers VPC 서비스(edge/)가 이 터널을 통해
    # agent·workout 등에 이름으로 닿는다 - 서비스들은 이 네트워크 안에만 있다.
    depends_on:
      - agent
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default
      - browser
    restart: unless-stopped

# 네트워크를 나눈다(D-2). 기본 네트워크(jarvis_default)는 서비스끼리의 HTTP 용이다.
# - data: Postgres 와 FalkorDB. DB 를 쓰는 서비스만 붙는다 - 손님 agent, 수집기,
#   브라우저는 DB 에 닿지 못한다.
# - browser: 바깥 웹페이지를 여는 브라우저. agent(MCP·결제 가드), status(포트 확인),
#   tunnel(화면 탭의 VNC)만 붙는다 - 페이지가 브라우저를 장악해도 다른 서비스에는 닿지 못한다.
networks:
  data:
  browser:

volumes:
  jarvis-guest-workspace:
  jarvis-guest-home:
  jarvis-guest-data:
  jarvis-postgres:
  jarvis-home:
  jarvis-data:
  jarvis-kakaotalk-data:
  chrome-profile:
  jarvis-uploads:
  jarvis-imessage-data:
  jarvis-falkordb:
